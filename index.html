<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="収支帳">
<title>パチンコ・パチスロ収支帳</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div><small>競馬もまとめて収支管理</small><h1>パチンコ・パチスロ収支帳</h1></div><button id="addTop">＋ 記録</button></header>
<main>
<section id="home" class="page active">
  <div class="hero card"><span>年間収支</span><strong id="yearNet">¥0</strong><div class="mini"><div>今月<b id="monthNet">¥0</b></div><div>累計<b id="allNet">¥0</b></div></div></div>
  <div class="seg"><button data-range="month">月別</button><button data-range="year" class="on">年別</button><button data-range="all">累計</button></div>
  <div id="summary" class="grid"></div>
  <div class="card"><div class="cardTitle">収支推移</div><canvas id="chart" height="190"></canvas></div>
  <div class="card"><div class="cardTitle">最近の記録</div><div id="recent"></div></div>
</section>
<section id="history" class="page">
  <div class="toolbar"><select id="filterType"><option value="">すべて</option><option>パチンコ</option><option>パチスロ</option><option>競馬</option></select><input id="filterMonth" type="month"></div>
  <div id="historyList"></div>
</section>
<section id="analysis" class="page">
  <div id="analysisCards" class="grid"></div>
  <div class="card"><div class="cardTitle">店舗・競馬場別</div><div id="placeStats"></div></div>
  <div class="card"><div class="cardTitle">月別収支</div><div id="monthlyStats"></div></div>
</section>
<section id="settings" class="page">
 <div class="card"><div class="cardTitle">データ管理</div><p>記録はこの端末に保存されます。機種変更前はバックアップしてください。</p>
 <button id="exportBtn" class="wide">バックアップを書き出す</button>
 <label class="wide file">バックアップを復元<input id="importFile" type="file" accept="application/json"></label></div>
</section>
</main>
<nav><button data-page="home" class="on">⌂<span>ホーム</span></button><button data-page="history">▤<span>履歴</span></button><button id="addNav" class="plus">＋</button><button data-page="analysis">⌁<span>分析</span></button><button data-page="settings">⚙<span>設定</span></button></nav>
<dialog id="editor"><form id="form" method="dialog">
<div class="modalHead"><h2 id="formTitle">収支を記録</h2><button type="button" id="close">×</button></div>
<input type="hidden" id="editId">
<label>日付<input id="date" type="date" required></label>
<label>ジャンル<select id="type" required><option>パチンコ</option><option>パチスロ</option><option>競馬</option></select></label>
<label id="placeLabel">店舗<input id="place" list="places" placeholder="店舗名"></label><datalist id="places"></datalist>
<label>機種名・レース名<input id="title" placeholder="例：北斗の拳 / 札幌記念"></label>
<div class="two"><label>投資額<input id="invest" type="number" inputmode="numeric" min="0" value="0" required></label><label>回収額<input id="return" type="number" inputmode="numeric" min="0" value="0" required></label></div>
<div class="preview">今回の収支 <strong id="previewNet">¥0</strong></div>
<label>メモ<textarea id="memo" rows="3" placeholder="台番号、買い目、気づいたことなど"></textarea></label>
<button class="save" value="default">保存する</button><button type="button" id="deleteBtn" class="danger hidden">この記録を削除</button>
</form></dialog>
<script src="app.js"></script>
</body></html>
